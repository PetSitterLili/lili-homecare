<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="strict-origin-when-cross-origin"><title>The Pet Sitter Lili｜家訪與照護</title><link rel="icon" href="assets/crm-black-cat.svg" type="image/svg+xml"><link rel="manifest" href="manifest.webmanifest?v=2.0.1126.16"><meta name="theme-color" content="#786b86"><link rel="stylesheet" href="workspace.css?v=2.0.1126.16"><script src="config.js"></script><script src="https://accounts.google.com/gsi/client" async defer></script></head>
<body><header><div class="brand"><img src="assets/cat.png" alt="ㄌㄌ保姆"><div>The Pet Sitter Lili<small>家訪到照護，一個家的完整交接</small></div></div><button id="cloud">連接 Google Drive</button></header><main><aside><div class="row"><h2>家庭檔案</h2><button id="new">新增家庭</button></div><input id="search" aria-label="搜尋家庭、家長、電話或地址" placeholder="家庭／毛寶／家長／電話／地址"><div id="families"></div><p id="connection">Google Drive 尚未連線</p><button id="restore">從完整備份還原</button><button id="legacyImport">匯入舊客資料</button><input id="legacyImportFile" type="file" accept=".json,application/json" hidden><input id="restoreFile" type="file" accept=".json" hidden><button id="archive">已刪除家庭</button><button id="brandEdit">品牌設定</button><button id="rateEdit">全域費率設定</button></aside><section id="main"><div class="empty"><h1>先認識這個家，再安心接手。</h1><p>新增家庭，先填預約與已知資料，家訪時再補細節。</p><button id="demo">試填範例家庭</button></div></section></main>
<div id="toast" role="status" hidden></div>
<dialog id="confirm"><h2 id="confirmTitle"></h2><p id="confirmText"></p><div class="row"><button id="cancelConfirm">取消</button><button id="yesConfirm" class="primary">確認</button></div></dialog>
<dialog id="brandDialog"><h2>全家庭共用品牌設定</h2><p id="brandStatus" role="status"></p><label>標準服務規格<textarea id="service" rows="5"></textarea></label><label>安心承諾<textarea id="promise" rows="5"></textarea></label><label>品牌聯繫資訊<textarea id="contact" rows="5"></textarea></label><textarea id="rates" hidden></textarea><p class="muted">家訪與照護 · 2.0.1126.16</p><button id="brandClose">取消</button><button id="brandSave">儲存設定</button></dialog><dialog id="setup"><h2>連接保姆 Google Drive</h2><p>使用 petsitterlili2025@gmail.com。第一次需先設定 App 專用的 Google OAuth 用戶端 ID，完成後才可跨瀏覽器載入資料。</p><input id="clientId" aria-label="Google OAuth 用戶端 ID" placeholder="…apps.googleusercontent.com"><p>尚未連線時，畫面會保存原瀏覽器草稿；它不是唯一備份，亦不會自動出現在其他瀏覽器。</p><div class="row"><button id="closeSetup">關閉</button><button id="connectSetup" class="primary">連接</button></div></dialog>
<dialog id="lightbox"><button id="closePhoto" class="close" aria-label="關閉照片">×</button><img id="fullPhoto" alt=""><p id="fullCaption"></p></dialog>
<input id="photoFiles" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden>
<script type="module" src="workspace.mjs?v=2.0.1126.16"></script></body></html>
